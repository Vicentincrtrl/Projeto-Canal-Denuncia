<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a href="#conteudo" class="pular-link">Ir para o conteúdo</a>
  <header class="cabecalho">
    <div class="cabecalho-interno">
      <a href="index.html" class="marca">TARRAF <span>Canal de Denúncias</span></a>
      <nav aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a href="denuncia.html">Fazer denúncia</a>
        <a href="consulta.html">Acompanhar</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="container">
    <h1>Área restrita</h1>
    <p>Acesso para analistas e administradores.</p>

    <form id="form-login" class="formulario">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>

      <p id="mensagem-erro" class="erro" role="alert"></p>
      <button type="submit">Entrar</button>
    </form>

    <p><a href="index.html">Voltar para o início</a></p>
  </main>

  <footer class="rodape">
    <p>Projeto de extensão da Fatec · Canal de denúncias anônimas</p>
    <p><a href="login.html">Área restrita</a></p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
